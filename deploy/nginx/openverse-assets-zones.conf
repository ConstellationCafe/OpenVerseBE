# Counter for the game-file connection limit in openverse-path.conf / openverse-subdomain.conf. These lines must be at
# the http { } level, which is what /etc/nginx/conf.d/ is on Ubuntu:
#
#   sudo cp deploy/nginx/openverse-assets-zones.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# per player (by address). The bandwidth and the waiting line are OpenVerseBE's (OVBE_ASSET_* in .env)
limit_conn_zone $binary_remote_addr zone=ov_assets_per_ip:1m;
# no longer used by the shipped location blocks; kept so a location still carrying "limit_conn ov_assets_total"
# keeps loading until it is updated
limit_conn_zone $server_name zone=ov_assets_total:1m;
