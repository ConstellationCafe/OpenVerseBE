# A location to paste INTO the server { } block that already serves your site (e.g. the WebUI on your iptime DDNS
# name), when you have only one domain. OpenVerseBE is then served under https://<your domain>/openverse/
#
#   sudo nano /etc/nginx/sites-available/<your site>        # paste the blocks below inside its server { }
#   sudo cp deploy/nginx/openverse-assets-zones.conf /etc/nginx/conf.d/     # for the game-file limits
#   sudo nginx -t && sudo systemctl reload nginx
#
# Players: be_url.txt = https://<your domain>/openverse
# Smoke test: put OVBE_PUBLIC_URL=https://<your domain>/openverse in .env

    location /openverse/ {
        # the trailing slash strips /openverse/ before the request reaches OpenVerseBE
        proxy_pass http://127.0.0.1:5080/;
        # HTTP/1.1, not nginx's default 1.0: a body-less POST (entering a room) over 1.0 is rejected by Kestrel
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # set, not appended: whatever the client sent is dropped, so nobody can claim someone else's address.
        # this is the address the battle server uses to tell the two players apart
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Game files (~13 GB for a fresh install) for players whose own Shadowverse folder lacks them. Limited so a
    # download never starves the battles and the rest of this site on a home upload line. Needs the zones in
    # openverse-assets-zones.conf (conf.d). Each player's OpenVerse asks for at most 2 files at a time, so:
    #   one player  <= 2 x limit_rate          the whole server <= ov_assets_total x limit_rate
    # Defaults for a ~36 Mbit/s upload: 1 MB/s per connection, 3 at once = ~24 Mbit/s for downloads at most.
    # Raise both once the upload is measured on a wired connection
    location /openverse/v1/assets/ {
        proxy_pass http://127.0.0.1:5080/v1/assets/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_rate 1m;
        limit_conn ov_assets_per_ip 2;
        limit_conn ov_assets_total 3;
        # over the limit: 503, and OpenVerse waits and asks again
        limit_conn_status 503;
        # stream through instead of spooling whole bundles to disk first, so the rate limit paces the reads too
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
