# /etc/nginx/sites-available/openverse   (domain or subdomain of its own, e.g. ov.example.com)
#
#   sudo cp deploy/nginx/openverse-subdomain.conf /etc/nginx/sites-available/openverse
#   sudo nano /etc/nginx/sites-available/openverse          # server_name
#   sudo cp deploy/nginx/openverse-assets-zones.conf /etc/nginx/conf.d/     # for the game-file limits
#   sudo ln -s /etc/nginx/sites-available/openverse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ov.example.com                  # adds HTTPS and the http->https redirect
#
# Players: be_url.txt = https://ov.example.com
server {
    listen 80;
    listen [::]:80;
    server_name ov.example.com;

    location / {
        proxy_pass http://127.0.0.1:5080;
        # HTTP/1.1, not nginx's default 1.0: a body-less POST (entering a room) over 1.0 is rejected by Kestrel
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # set, not appended: whatever the client sent is dropped, so nobody can claim someone else's address.
        # this is the address the battle server uses to tell the two players apart
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Game files (~13 GB for a fresh install) for players whose own Shadowverse folder lacks them. OpenVerseBE itself
    # shares one upload budget between whoever is downloading and lines up the rest (OVBE_ASSET_RATE_MBPS,
    # OVBE_ASSET_MAX_ACTIVE in .env), so nginx only passes it through. Needs the zone in openverse-assets-zones.conf
    location /v1/assets/ {
        proxy_pass http://127.0.0.1:5080/v1/assets/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a safety net only: each player's OpenVerse opens 2 at a time
        limit_conn ov_assets_per_ip 4;
        limit_conn_status 503;
        # stream through instead of spooling whole bundles to disk, so OpenVerseBE's pacing reaches the player
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
