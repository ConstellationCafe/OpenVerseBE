# Settings to have in /etc/redis/redis.conf (edit the existing lines rather than appending duplicates)

# never reachable from outside the machine
bind 127.0.0.1 ::1
protected-mode yes

# same value as the password= part of OVBE_REDIS / OPENVERSE_REDIS
requirepass CHANGE_ME_REDIS_PASSWORD

# players and their viewer ids survive a reboot. rooms expire on their own anyway
appendonly yes
appendfsync everysec
