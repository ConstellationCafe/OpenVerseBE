name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build OpenVerseBE.slnx -c Release
      - run: dotnet test OpenVerseBE.slnx -c Release --no-build --logger "console;verbosity=normal"
        env:
          OVBE_TEST_REDIS: 127.0.0.1:6379
      - run: dotnet publish src/OpenVerseBE/OpenVerseBE.csproj -c Release -r linux-x64 --self-contained false -o publish
