# OpenVerse central matching on one host:
#   cp .env.example .env   (fill it in)
#   mkdir -p data && cp /path/to/card_master_full.csv.gz data/
#
#   docker compose up -d --build                    # behind an nginx (or other proxy) already on this host
#   docker compose --profile caddy up -d --build    # nothing on 80/443 yet: bundled Caddy does HTTPS
#
# Optional: game files for players whose own Shadowverse folder lacks them -> OVBE_ASSET_DIR in .env
#
# Published ports: 3001 (battle socket) and 127.0.0.1:5080 (OpenVerseBE, for the host's own proxy only).
# With the caddy profile also 80 + 443. Redis is reachable only inside this network.

name: openverse

x-redis-conn: &redis-conn "redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env},abortConnect=false"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [ov]

  be:
    build: .
    image: openversebe:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      OVBE_REDIS: *redis-conn
      OVBE_KEY_PREFIX: "ov:"
      # what players' games are told to open the battle socket to
      OVBE_NODE_URL: ${OVBE_DOMAIN:?set OVBE_DOMAIN in .env}:3001
      OVBE_CAFE_KEY: ${OVBE_CAFE_KEY:-}
      OVBE_ROOM_TTL_MINUTES: ${OVBE_ROOM_TTL_MINUTES:-180}
      OVBE_MAX_ROOMS: ${OVBE_MAX_ROOMS:-10}
      # X-Forwarded-For carries each player's real IP, which the seat check needs. Believed only from Caddy's fixed
      # address and from the network gateway, which is how the host's own nginx reaches the loopback-only port below
      OVBE_TRUSTED_PROXIES: 172.28.0.10,172.28.0.1
      # game files and the card master for players whose own copy lacks them (paths inside the container)
      OVBE_ASSET_DIR: /app/assets
      OVBE_CARD_MASTER: /app/data/card_master_full.csv.gz
      OVBE_STATE_DIR: /app/state
      # game-file upload budget (Mbit/s, shared by everyone downloading), how many download at once, and how long an
      # idle place is kept. See .env.example
      OVBE_ASSET_RATE_MBPS: ${OVBE_ASSET_RATE_MBPS:-64}
      OVBE_ASSET_MAX_ACTIVE: ${OVBE_ASSET_MAX_ACTIVE:-2}
      OVBE_ASSET_IDLE_SECONDS: ${OVBE_ASSET_IDLE_SECONDS:-120}
    volumes:
      # a copy of a player's %UserProfile%\AppData\LocalLow\Cygames\Shadowverse. Left unset, no game files are served
      - ${OVBE_ASSET_DIR:-./assets}:/app/assets:ro
      # the same card master the battle server reads
      - ${OVBE_DATA_DIR:-./data}:/app/data:ro
      # the asset index (hashing ~13 GB takes minutes, so it is kept between restarts)
      - be-state:/app/state
    ports:
      # loopback only: the host's nginx proxies to it, nothing outside the machine can reach it
      - "127.0.0.1:${OVBE_HOST_PORT:-5080}:5080"
    networks: [ov]

  battle:
    build:
      # the battle server lives in the OpenVerse repository
      context: ${OPENVERSE_GIT:-https://github.com/ConstellationCafe/OpenVerse.git}#${OPENVERSE_REF:-main}
      dockerfile: src/OpenVerse.Battle/Dockerfile
      # the battle engine (client DLLs + headless Unity shim) is never in a repository. A host that has built it
      # points OVBE_ENGINE_DIR at the folder; without it this is an empty folder and the server relays only
      args:
        ENGINE: engine
      additional_contexts:
        engine: ${OVBE_ENGINE_DIR:-./deploy/engine-none}
    image: openverse-battle:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      OPENVERSE_REDIS: *redis-conn
      OPENVERSE_REDIS_PREFIX: "ov:"
      OPENVERSE_ENGINE_ROLE: ${OPENVERSE_ENGINE_ROLE:-AnswerBlanks}
    volumes:
      # card_master_full.csv.gz from a player's server/data folder. OVBE_DATA_DIR moves it out of the checkout
      # (CD replaces the checkout on every deploy)
      - ${OVBE_DATA_DIR:-./data}:/app/data:ro
    ports:
      - "3001:3001"
    networks: [ov]

  # only with --profile caddy: for a host with nothing on ports 80/443 yet
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [be]
    environment:
      OVBE_DOMAIN: ${OVBE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      ov:
        ipv4_address: 172.28.0.10

networks:
  ov:
    ipam:
      config:
        # fixed so the trusted proxy addresses above (Caddy .10, gateway .1) hold
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  be-state:
  redis-data:
  caddy-data:
  caddy-config:
